<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
let allDocs = [];
let activeFilter = 'all';

const CAT_ICONS = {
  certificate:'🎓', decision:'📋', report:'📊', contract:'📝', general:'📄', project:'🏗️', default:'📄'
};
const CAT_BADGE = {
  certificate:'badge-cert', decision:'badge-doc', report:'badge-hr', contract:'badge-proj', general:'', project:'badge-proj'
};

async function loadDocs() {
  if (!_db) { setTimeout(loadDocs, 300); return; }
  const { data, error } = await _db.from('documents').select('*').eq('is_private', false).order('category').order('created_at', { ascending: false });
  if (error) { document.getElementById('docs-container').innerHTML = '<div class="empty">Could not load documents.</div>'; return; }
  allDocs = data || [];
  renderStats();
  renderDocs();
}

function renderStats() {
  const total = allDocs.length;
  const cats  = [...new Set(allDocs.map(d => d.category))];
  document.getElementById('docs-stats').innerHTML = `
    <div class="stat-pill"><span>${total}</span> Total Documents</div>
    <div class="stat-pill"><span>${cats.length}</span> Categories</div>
    <div class="stat-pill">Last updated: <span>${allDocs[0] ? new Date(allDocs[0].created_at).toLocaleDateString() : '—'}</span></div>
  `;
}

function renderDocs() {
  const query = document.getElementById('search-input').value.toLowerCase();
  const filtered = allDocs.filter(d => {
    const matchCat  = activeFilter === 'all' || d.category === activeFilter;
    const matchText = !query || d.title_en.toLowerCase().includes(query) || (d.title_ar||'').includes(query) || (d.description||'').toLowerCase().includes(query);
    return matchCat && matchText;
  });

  const el = document.getElementById('docs-container');
  if (!filtered.length) {
    el.innerHTML = `<div class="empty" style="padding:4rem;">
      <div style="font-size:2rem;margin-bottom:1rem;opacity:.3;">📭</div>
      <span data-en="No documents found" data-ar="لا توجد وثائق">No documents found</span>
    </div>`;
    return;
  }

  el.innerHTML = filtered.map(doc => {
    const icon  = CAT_ICONS[doc.category] || CAT_ICONS.default;
    const badge = CAT_BADGE[doc.category] || '';
    const lang  = document.documentElement.lang;
    const title = lang === 'ar' && doc.title_ar ? doc.title_ar : doc.title_en;
    const size  = doc.file_size ? formatBytes(doc.file_size) : '';
    const date  = new Date(doc.created_at).toLocaleDateString('en-GB', {year:'numeric',month:'short',day:'numeric'});
    return `
    <div class="doc-card reveal">
      <div class="doc-icon">${icon}</div>
      <div class="doc-info">
        <div class="doc-title">${escHtml(title)}</div>
        <div class="doc-meta">
          <span class="badge ${badge}">${doc.category}</span>
          ${size ? `&nbsp;·&nbsp; ${size}` : ''}
          &nbsp;·&nbsp; ${date}
        </div>
        ${doc.description ? `<p style="font-size:.82rem;color:rgba(232,226,212,.55);margin-bottom:.75rem;line-height:1.6;">${escHtml(doc.description)}</p>` : ''}
        <div class="doc-actions">
          ${doc.file_url ? `<a href="#" onclick="handleDownload(event,'${doc.file_url}')" class="cert-view-btn">↗ View</a>` : ''}
          ${doc.file_url ? `<a href="#" onclick="handleDownload(event,'${doc.file_url}',true)" class="cert-view-btn" style="color:var(--muted);">⬇ Download</a>` : ''}
          <button onclick="toggleDocComments('${doc.id}')" class="cert-view-btn" style="color:var(--muted);" id="cmt-btn-${doc.id}">💬 Comments</button>
        </div>
        <!-- Comments Section -->
        <div id="doc-comments-${doc.id}" style="display:none;margin-top:1rem;border-top:1px solid var(--border);padding-top:1rem;">
          <div id="doc-cmt-list-${doc.id}"></div>
          <div id="doc-cmt-form-${doc.id}" style="margin-top:.75rem;"></div>
        </div>
      </div>
    </div>`;
  }).join('');

  // Re-init reveal for new elements
  const obs = new IntersectionObserver(entries => {
    entries.forEach((e,i) => { if(e.isIntersecting) setTimeout(()=>e.target.classList.add('visible'),i*60); });
  },{threshold:.08});
  el.querySelectorAll('.reveal').forEach(r => obs.observe(r));
}

function setFilter(cat, btn) {
  activeFilter = cat;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderDocs();
}

function filterDocs() { renderDocs(); }

// ── DOCUMENT COMMENTS ────────────────────────────────────────
let openDocComments = {};

async function toggleDocComments(docId) {
  const section = document.getElementById(`doc-comments-${docId}`);
  if(!section) return;
  if(section.style.display === 'none') {
    section.style.display = 'block';
    openDocComments[docId] = true;
    await loadDocComments(docId);
  } else {
    section.style.display = 'none';
    delete openDocComments[docId];
  }
}

async function loadDocComments(docId) {
  if(!_db) return;
  const { data } = await _db.from('comments')
    .select('*').eq('video_id', docId).eq('is_approved', true).order('created_at');

  const listEl = document.getElementById(`doc-cmt-list-${docId}`);
  const formEl = document.getElementById(`doc-cmt-form-${docId}`);
  const {data:{session}} = await _db.auth.getSession();
  const user = session?.user;

  // Render comments
  if(!data?.length) {
    listEl.innerHTML = `<p style="font-size:.8rem;color:var(--muted);margin-bottom:.75rem;" data-en="No comments yet." data-ar="لا توجد تعليقات بعد.">No comments yet. Be the first!</p>`;
  } else {
    listEl.innerHTML = data.map(c=>{
      const time = new Date(c.created_at).toLocaleDateString('en-GB',{year:'numeric',month:'short',day:'numeric'});
      const canDel = user && (user.id===c.user_id || user.email==='mahmoudeldeberky@gmail.com');
      return `<div style="display:flex;gap:.75rem;padding:.6rem 0;border-bottom:1px solid rgba(196,163,90,.08);">
        <div style="width:32px;height:32px;border-radius:50%;border:1px solid var(--border);overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--bg3);font-size:.85rem;">
          ${c.user_avatar?`<img src="${c.user_avatar}" style="width:100%;height:100%;object-fit:cover;">`:(c.user_name||'?')[0].toUpperCase()}
        </div>
        <div style="flex:1;">
          <div style="font-size:.78rem;color:var(--gold);margin-bottom:.2rem;">${escHtml(c.user_name||c.user_email.split('@')[0])}</div>
          <div style="font-size:.85rem;color:rgba(232,226,212,.8);line-height:1.6;">${escHtml(c.content)}</div>
          <div style="display:flex;gap:1rem;align-items:center;margin-top:.25rem;">
            <span style="font-size:.65rem;color:var(--muted);">${time}</span>
            ${canDel?`<span style="font-size:.65rem;color:#cc4444;cursor:pointer;" onclick="deleteDocComment('${c.id}','${docId}')">Delete</span>`:''}
          </div>
        </div>
      </div>`;
    }).join('');
  }

  // Render form
  if(!user) {
    formEl.innerHTML = `<button onclick="document.getElementById('login-modal').style.display='flex'" 
      style="font-size:.75rem;color:var(--gold);background:none;border:1px solid rgba(196,163,90,.3);padding:5px 14px;cursor:pointer;font-family:inherit;">
      Sign in to comment
    </button>`;
  } else {
    formEl.innerHTML = `<div style="display:flex;gap:.5rem;margin-top:.5rem;">
      <textarea id="doc-cmt-text-${docId}" placeholder="Write a comment..." rows="2"
        style="flex:1;background:var(--bg3);border:1px solid var(--border);color:var(--cream);padding:.5rem .75rem;font-size:.82rem;font-family:inherit;resize:none;outline:none;"></textarea>
      <button type="button" onclick="submitDocComment('${docId}')" class="btn btn-gold btn-sm" style="align-self:flex-end;">Post</button>
    </div>`;
  }
}

async function submitDocComment(docId) {
  if(!_db) return;
  const {data:{session}} = await _db.auth.getSession();
  if(!session) return;
  const text = document.getElementById(`doc-cmt-text-${docId}`)?.value.trim();
  if(!text) return;
  const user = session.user;
  await _db.from('comments').insert({
    video_id:    docId,
    user_id:     user.id,
    user_email:  user.email,
    user_name:   user.user_metadata?.full_name || user.email.split('@')[0],
    user_avatar: user.user_metadata?.avatar_url || '',
    content:     text,
    is_approved: true
  });
  loadDocComments(docId);
}

async function deleteDocComment(cmtId, docId) {
  if(!confirm('Delete this comment?')) return;
  await _db.from('comments').delete().eq('id', cmtId);
  loadDocComments(docId);
}

// Auth
async function signInLinkedIn() {
  if(!_db) return;
  document.getElementById('login-modal').style.display='none';
  await _db.auth.signInWithOAuth({ provider:'linkedin_oidc', options:{ redirectTo: window.location.href }});
}

async function signInGoogle() {
  if(!_db) return;
  await _db.auth.signInWithOAuth({ provider:'google', options:{ redirectTo: window.location.href }});
}

async function handleDownload(e, url, isDownload=false) {
  e.preventDefault();
  if(!_db) return;
  const {data:{session}} = await _db.auth.getSession();
  if(!session) {
    document.getElementById('login-modal').style.display='flex';
    return;
  }
  if(isDownload) { const a=document.createElement('a');a.href=url;a.download='';a.target='_blank';a.click(); }
  else { window.open(url,'_blank'); }
}

// Check if logged in and show user badge
window.addEventListener('load', async () => {
  await new Promise(r=>setTimeout(r,400));
  if(!_db) return;
  const {data:{session}} = await _db.auth.getSession();
  if(session?.user) {
    const name = session.user.user_metadata?.full_name || session.user.email;
    const avatar = session.user.user_metadata?.avatar_url;
    const topBar = document.querySelector('nav .nav-right');
    const badge = document.createElement('div');
    badge.style.cssText='display:flex;align-items:center;gap:.5rem;';
    badge.innerHTML = `${avatar?`<img src="${avatar}" style="width:26px;height:26px;border-radius:50%;">`:''}
      <span style="font-size:.75rem;color:var(--cream);">${name}</span>
      <button onclick="signOut()" style="font-size:.7rem;color:var(--muted);background:none;border:none;cursor:pointer;">Sign Out</button>`;
    topBar?.insertBefore(badge, topBar.querySelector('.lang-toggle'));
  }
  loadDocs();
});

async function signOut() {
  await _db.auth.signOut();
  location.reload();
}

function escHtml(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function formatBytes(b) {
  if(!b) return '';
  if(b<1024) return b+' B';
  if(b<1048576) return (b/1024).toFixed(1)+' KB';
  return (b/1048576).toFixed(1)+' MB';
}

// Wait for shared.js to init Supabase - handled above in load event
</script>
