<style>
  .hr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1.3rem;}
  .hr-card{background:var(--bg2);border:1px solid var(--border);padding:1.6rem;transition:border-color .3s,transform .2s;position:relative;overflow:hidden;}
  .hr-card:hover{border-color:rgba(196,163,90,.5);transform:translateY(-2px);}
  .hr-card::before{content:'';position:absolute;top:0;left:0;width:100%;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:0;transition:opacity .3s;}
  .hr-card:hover::before{opacity:1;}
  .hr-icon{font-size:2rem;margin-bottom:1rem;}
  .hr-title{font-family:var(--ff-h);font-size:1.15rem;color:var(--cream);margin-bottom:.5rem;}
  .hr-desc{font-size:.85rem;color:rgba(232,226,212,.6);line-height:1.8;margin-bottom:1rem;}
  .hr-tags{display:flex;flex-wrap:wrap;gap:6px;}
  .coming-soon{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);border:1px solid var(--border);padding:3px 10px;display:inline-block;}
  .doc-card{background:var(--bg2);border:1px solid var(--border);padding:1.4rem;display:flex;gap:1.2rem;align-items:flex-start;transition:border-color .3s;margin-bottom:.75rem;}
  .doc-card:hover{border-color:rgba(196,163,90,.5);}
  .doc-icon{width:44px;height:44px;background:rgba(196,163,90,.1);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:1.3rem;flex-shrink:0;}
  .doc-info{flex:1;}
  .doc-title{font-family:var(--ff-h);font-size:1rem;color:var(--cream);margin-bottom:.25rem;}
  .doc-meta{font-size:.75rem;color:var(--muted);}
  .cert-view-btn{display:inline-flex;align-items:center;gap:5px;font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);text-decoration:none;border:1px solid rgba(196,163,90,.3);padding:4px 12px;transition:all .2s;margin-top:.6rem;}
  .cert-view-btn:hover{background:rgba(196,163,90,.1);}
</style>

<div class="page-wrap">
  <div class="page-hero anim-1">
    <p class="stag" data-en="Resources & Tools" data-ar="الموارد والأدوات">Resources & Tools</p>
    <h1 data-en="HR<br><span>Material</span>" data-ar="موارد<br><span>HR</span>">HR<br><span>Material</span></h1>
    <div class="divider"></div>
    <p data-en="A curated collection of HR resources, templates, policies, and tools — built from real-world experience."
       data-ar="مجموعة منتقاة من موارد HR والنماذج والسياسات والأدوات — مبنية من تجربة عملية حقيقية.">
       A curated collection of HR resources, templates, policies, and tools.</p>
  </div>

  <div class="inner" style="padding-top:1rem;">

    <!-- PUBLIC HR DOCUMENTS FROM SUPABASE -->
    <div style="margin-top:5rem;">
      <p class="stag reveal" data-en="Published Materials" data-ar="المواد المنشورة">Published Materials</p>
      <h2 class="stitle reveal" data-en="HR Documents & Resources" data-ar="وثائق وموارد HR">HR Documents & Resources</h2>
      <div class="divider reveal"></div>
      <div id="hr-docs-list">
        <div class="empty"><span class="spinner"></span><br><br><span data-en="Loading resources..." data-ar="جار التحميل...">Loading resources...</span></div>
      </div>
      <div style="margin-top:1.5rem;text-align:center;">
        <a href="documents" class="btn btn-outline" data-en="→ View All Documents" data-ar="→ عرض كل الوثائق">→ View All Documents</a>
      </div>
    </div>

  </div>
</div>

<footer>
  <p>© 2026 Mahmoud El-Deberky</p>
  <p data-en="Crafted by Mahmoud El-Deberky" data-ar="صُنع بواسطة محمود الدبركي">Crafted by Mahmoud El-Deberky</p>
</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="shared.js"></script>
<script>
async function loadHRDocs() {
  if(!_db){setTimeout(loadHRDocs,300);return;}
  const {data} = await _db.from('documents').select('*').eq('is_private',false).order('created_at',{ascending:false}).limit(6);
  const el = document.getElementById('hr-docs-list');
  if(!data?.length){
    el.innerHTML='<div class="empty" style="padding:2rem;" data-en="No resources published yet." data-ar="لم يتم نشر موارد بعد.">No resources published yet.</div>';
    return;
  }
  const icons = {certificate:'🎓',decision:'📋',report:'📊',contract:'📝',general:'📄'};
  el.innerHTML = data.map(doc=>`
    <div class="doc-card reveal">
      <div class="doc-icon">${icons[doc.category]||'📄'}</div>
      <div class="doc-info">
        <div class="doc-title">${doc.title_en}</div>
        <div class="doc-meta">${doc.category} · ${new Date(doc.created_at).toLocaleDateString()}</div>
        ${doc.description?`<p style="font-size:.8rem;color:rgba(232,226,212,.5);margin-top:.3rem;">${doc.description}</p>`:''}
        ${doc.file_url?`<a href="${doc.file_url}" target="_blank" class="cert-view-btn">↗ View</a>`:''}
      </div>
    </div>`).join('');
  const obs=new IntersectionObserver(entries=>{entries.forEach((e,i)=>{if(e.isIntersecting)setTimeout(()=>e.target.classList.add('visible'),i*70);});},{threshold:.08});
  el.querySelectorAll('.reveal').forEach(r=>obs.observe(r));
}
window.addEventListener('load',()=>setTimeout(loadHRDocs,400));
</script>
